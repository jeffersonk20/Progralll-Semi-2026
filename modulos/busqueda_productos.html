<form id="frmConsultarProducto">
    <div class="card text-bg-dark mb-3 shadow" style="min-width: 620px;">
        <div class="card-header bg-secondary text-white">
            <div class="d-flex align-items-center">
                <span class="fw-bold">::.. Búsqueda de Productos ..::</span>
                <div class="ms-auto">
                    <button data-form="busqueda_productos" type="button" class="btn-close btn-close-white"
                        aria-label="Close"></button>
                </div>
            </div>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-12">
                    <div class="table-responsive">
                        <table class="table table-dark table-striped table-hover align-middle">
                            <thead>
                                <tr>
                                    <th colspan="4">
                                        <input type="search" placeholder="Buscar por código o descripción..."
                                            id="txtBuscarProducto" name="txtBuscarProducto" class="form-control">
                                    </th>
                                </tr>
                                <tr class="table-primary text-dark">
                                    <th>Código</th>
                                    <th>Descripción</th>
                                    <th>Estado</th>
                                    <th style="width: 80px;" class="text-center">Acción</th>
                                </tr>
                            </thead>
                            <tbody id="tblProductos"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</form>

<script>
    txtBuscarProducto.addEventListener('keyup', (e) => {
        e.preventDefault();
        obtenerProductos(txtBuscarProducto.value);
    });

    async function obtenerProductos(buscar = "") {
        try {
            let response = await fetch(`/productos?buscar=${encodeURIComponent(buscar)}`);
            let datos = await response.json();
            mostrarDatosProductos(Array.isArray(datos) ? datos : []);
        } catch (e) {
        }
    }

    function mostrarDatosProductos(datos) {
        let filas = "";
        if (datos.length === 0) {
            filas = `<tr><td colspan="4" class="text-center text-muted py-3">No se encontraron productos registrados</td></tr>`;
        } else {
            datos.forEach(e => {
                const badgeClass = e.estado === 'Activo' ? 'badge bg-success' : 'badge bg-danger';
                filas += `
                    <tr style="cursor: pointer;" onclick='seleccionarProducto(${JSON.stringify(e)}, event)'>
                        <td class="fw-bold">${e.codigo}</td>
                        <td>${e.descripcion}</td>
                        <td><span class="${badgeClass}">${e.estado}</span></td>
                        <td class="text-center">
                            <button type="button" onclick='eliminarProductoDesdeBusqueda(${JSON.stringify(e)}, event)' 
                                class="btn btn-sm btn-danger">DEL</button>
                        </td>
                    </tr>
                `;
            });
        }
        tblProductos.innerHTML = filas;
    }

    function seleccionarProducto(data, event) {
        if (event) event.preventDefault();
        cargarForm('productos', () => {
            if (typeof modificarProducto === 'function') {
                modificarProducto(data, event);
            }
        });
    }

    async function eliminarProductoDesdeBusqueda(data, event) {
        if (event) {
            event.preventDefault();
            event.stopPropagation();
        }
        if (confirm(`¿Seguro de eliminar el producto: ${data.descripcion}?`)) {
            try {
                let datos = {
                    modulo: "producto",
                    accion: "eliminar",
                    idProducto: data.idProducto
                };
                let response = await fetch('/productos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });
                let respuesta = await response.json();
                if (respuesta.msg != "ok") {
                    if (typeof alertify !== 'undefined') {
                        alertify.error("Error al eliminar: " + respuesta.msg);
                    } else {
                        alert("Error: " + respuesta.msg);
                    }
                    return;
                }
                if (typeof alertify !== 'undefined') {
                    alertify.success("Producto eliminado exitosamente");
                } else {
                    alert("Producto eliminado exitosamente");
                }
                obtenerProductos(txtBuscarProducto.value);
                if (typeof limpiarFormularioProducto === 'function' && window.idProducto == data.idProducto) {
                    limpiarFormularioProducto();
                }
            } catch (err) {
                alert("Error de conexión al eliminar el producto.");
            }
        }
    }

    obtenerProductos();
</script>
