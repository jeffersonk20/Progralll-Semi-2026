<form id="frmProducto">
    <div class="card text-bg-dark mb-3 shadow" style="min-width: 550px;">
        <div class="card-header bg-primary text-white">
            <div class="d-flex align-items-center">
                <span class="fw-bold">::.. Administración de Productos ..::</span>
                <div class="ms-auto">
                    <button data-form="productos" type="button" class="btn-close btn-close-white" aria-label="Close"></button>
                </div>
            </div>
        </div>
        <div class="card-body">
            <div class="row p-2">
                <div class="col-12 col-md-5">
                    <label class="form-label text-light">Código:</label>
                    <input pattern="^[0-9A-Za-z-]{2,15}$" required placeholder="Ej: P001" name="txtCodigoProducto"
                        id="txtCodigoProducto" class="form-control" type="text">
                </div>
            </div>
            <div class="row p-2">
                <div class="col-12">
                    <label class="form-label text-light">Descripción:</label>
                    <input required placeholder="Descripción del producto" name="txtDescripcionProducto"
                        id="txtDescripcionProducto" class="form-control" type="text">
                </div>
            </div>
            <div class="row p-2">
                <div class="col-12 col-md-6">
                    <label class="form-label text-light">Estado:</label>
                    <select class="form-select" name="cboEstadoProducto" id="cboEstadoProducto">
                        <option value="Activo">Activo</option>
                        <option value="Inactivo">Inactivo</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="card-footer text-center bg-secondary-subtle">
            <input type="submit" value="Guardar" class="btn btn-primary me-1" id="btnGuardarProducto">
            <input type="button" value="Buscar" class="btn btn-secondary me-1" id="btnBuscarProducto">
            <input type="reset" value="Limpiar" class="btn btn-warning" id="btnLimpiarProducto">
        </div>
    </div>
</form>

<script>
    var accionProducto = 'nuevo',
        idProducto = '';

    frmProducto.addEventListener('submit', (e) => {
        e.preventDefault();
        guardarProductos();
    });

    frmProducto.addEventListener('reset', (e) => {
        e.preventDefault();
        limpiarFormularioProducto();
    });

    function modificarProducto(data, event) {
        if (event) event.preventDefault();
        idProducto = data.idProducto;
        accionProducto = "modificar";

        txtCodigoProducto.value = data.codigo;
        txtDescripcionProducto.value = data.descripcion;
        cboEstadoProducto.value = data.estado;
    }

    async function guardarProductos() {
        let datos = {
            modulo: "producto",
            codigo: txtCodigoProducto.value,
            descripcion: txtDescripcionProducto.value,
            estado: cboEstadoProducto.value,
            accion: accionProducto,
            idProducto: idProducto
        };

        try {
            let response = await fetch('/productos', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(datos)
            });
            let respuesta = await response.json();

            if (respuesta.msg != "ok") {
                if (typeof alertify !== 'undefined') {
                    alertify.error("Error: " + respuesta.msg);
                } else {
                    alert("Error: " + respuesta.msg);
                }
                return;
            }

            if (typeof alertify !== 'undefined') {
                alertify.success("Producto guardado exitosamente");
            } else {
                alert("Producto guardado exitosamente");
            }

            if (typeof obtenerProductos === 'function') {
                obtenerProductos();
            }
            limpiarFormularioProducto();
        } catch (err) {
            alert("Error de conexión al guardar producto.");
        }
    }

    function limpiarFormularioProducto() {
        accionProducto = 'nuevo';
        idProducto = '';
        txtCodigoProducto.value = '';
        txtDescripcionProducto.value = '';
        cboEstadoProducto.value = 'Activo';
    }

    btnBuscarProducto.addEventListener('click', (e) => {
        e.preventDefault();
        cargarForm('busqueda_productos');
    });
</script>
