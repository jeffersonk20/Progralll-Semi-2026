<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de tareas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-6">
            </div>
            <div class="container text-center">
                <div class="row">
                    <div class="col">
                        <input placeholder="Código" name="txtCodigoCliente" id="txtCodigoCliente" class="form-control"
                            type="text">
                    </div>
                </div>

                <div class="row">
                    <div class="col">
                        <input placeholder="Nombre" name="txtNombre" id="txtNombre" class="form-control" type="text">
                    </div>
                </div>

                <div class="row">
                    <div class="col">
                        <input placeholder="Direccion" name="txtDireccion" id="txtDireccion" class="form-control"
                            type="text">
                    </div>
                </div>


                <div class="row">
                    <div class="col">
                        <input placeholder="Telefono" name="txtTelefono" id="txtTelefono" class="form-control"
                            type="text">
                    </div>
                </div>

                <div class="row">
                    <div class="col">
                        <input placeholder="Email" name="txtEmail" id="txtEmail" class="form-control" type="text">
                    </div>
                </div>

                <div class="row">
                    <div class="col">
                        <select class="form-control" name="cboTipoPersona" id="cboTipoPersona">
                            <option value="Particular">Particular</option>
                            <option value="Empresa">Empresa</option>
                        </select>
                    </div>

                    <div class="row">
                        <div class="col">
                            <input class="btn btn-primary" type="button" value="Guardar">
                            <input class="btn btn-secondary" type="button" value="Modificar">
                            <input class="btn btn-warning" type="reset" value="Limpiar">
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
    <div class="col-6">

    </div>
    </div>
    </div>
</body>

<script>

</script>

</html>
