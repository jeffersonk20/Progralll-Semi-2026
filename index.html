<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Académico - Parcial II</title>
    <!-- Favicon prevent 404 -->
    <link rel="icon" href="data:,">
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- AlertifyJS CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/alertify.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/themes/bootstrap.min.css"/>
    <style>
        body {
            background: linear-gradient(135deg, #12161f 0%, #1a2233 100%);
            min-height: 100vh;
            color: #f1f5f9;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
        }
        .navbar {
            background-color: #0f172a !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .navbar-brand {
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #38bdf8 !important;
        }
        .nav-link {
            color: #94a3b8 !important;
            transition: color 0.2s, background-color 0.2s;
            border-radius: 6px;
            padding: 6px 14px !important;
        }
        .nav-link:hover {
            color: #ffffff !important;
            background-color: rgba(255, 255, 255, 0.08);
        }
        .position-absolute {
            z-index: 1000;
        }
        .ui-draggable .card-header {
            cursor: grab;
            user-select: none;
        }
        .ui-draggable .card-header:active {
            cursor: grabbing;
        }
        #login_contenedor {
            width: 440px;
            max-width: 95vw;
            z-index: 1100;
            margin: auto;
        }
        #usuarios_contenedor {
            top: 75px;
            left: 50px;
        }
        #busqueda_usuarios_contenedor {
            top: 75px;
            left: 650px;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            border-radius: 12px;
            overflow: hidden;
        }
        .card-header {
            background: linear-gradient(90deg, #1e293b, #334155);
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            padding: 14px 20px;
        }
        /* Estilos de inputs: texto blanco brillante y fondo contrastado */
        .form-control, .form-select {
            background-color: #0f172a !important;
            border: 1px solid #475569 !important;
            color: #ffffff !important;
            border-radius: 8px;
            font-size: 1rem;
            padding: 10px 14px;
        }
        .form-control::placeholder {
            color: #94a3b8 !important;
            opacity: 0.8 !important;
        }
        .form-control:focus, .form-select:focus {
            background-color: #0b1120 !important;
            border-color: #38bdf8 !important;
            color: #ffffff !important;
            box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.3) !important;
        }
        .input-group-text {
            background-color: #334155 !important;
            border: 1px solid #475569 !important;
            color: #cbd5e1 !important;
        }
        .btn {
            border-radius: 8px;
            font-weight: 500;
        }
        /* Overlay cuando la sesión no ha iniciado: Centrado perfecto en pantalla */
        #auth_overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, rgba(30, 41, 59, 0.88), rgba(15, 23, 42, 0.96));
            backdrop-filter: blur(8px);
            z-index: 1050;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
    </style>
    <script>
        // Protección contra filtraciones en la consola del navegador
        console.log = function () {};
        console.warn = function () {};
        console.error = function () {};
        console.info = function () {};
        console.debug = function () {};
    </script>
</head>
<body>
    <!-- Barra de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                <span>::.. SISTEMA ACADÉMICO ..::</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mnxNavegacion">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mnxNavegacion">
                <div class="navbar-nav me-auto" id="navOpciones" style="display: none;">
                    <a class="nav-link fw-semibold" href="#" data-form="usuarios">Formulario Usuarios</a>
                    <a class="nav-link fw-semibold" href="#" data-form="busqueda_usuarios">Búsqueda de Usuarios</a>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <div id="usuarioActivoInfo" class="text-light fw-medium" style="display: none;">
                        <span class="text-secondary small">Conectado:</span> <span id="lblUsuarioLogueado" class="text-info fw-bold"></span>
                    </div>
                    <button id="btnCerrarSesion" class="btn btn-outline-danger btn-sm" style="display: none;" onclick="cerrarSesion()">
                        Cerrar Sesión
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Overlay de Autenticación para bloqueo inicial estricto centrado -->
    <div id="auth_overlay">
        <div id="login_contenedor">
            <!-- Aquí se carga el login.html al abrir el servidor -->
        </div>
    </div>

    <!-- Área de Trabajo con Ventanas Flotantes Arrastrables -->
    <div class="container-fluid position-relative mt-2" id="areaTrabajo" style="display: none;">
        <div class="position-absolute" id="usuarios_contenedor"></div>
        <div class="position-absolute" id="busqueda_usuarios_contenedor"></div>
    </div>

    <!-- Scripts: jQuery, jQuery UI, AlertifyJS, Bootstrap 5, app.js -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/alertify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/app.js"></script>
</body>
</html>
